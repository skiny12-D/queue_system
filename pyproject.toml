[project]
name = "queue_system"
version = "0.1.0"
description = "Sistema de gestão de filas com API e monitorização online."
readme = "README.md"
requires-python = ">=3.11"
authors = ["Queue System <noreply@example.com>"]
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn>=0.22.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"
