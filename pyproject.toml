[project]
name = "queue_system"
version = "0.2.5"
description = "Sistema de gestão de filas com API e monitorização online."
readme = "README.md"
requires-python = ">=3.11"
authors = ["Queue System <noreply@example.com>"]
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn>=0.22.0",
  "qrcode>=7.3",
  "Pillow>=10.0",
  "fpdf>=1.7",
  "httpx>=0.27.0",
  "twilio>=8.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"
